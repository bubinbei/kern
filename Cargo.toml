[workspace]
members = ["crates/protocol", "crates/engine", "crates/core", "crates/demo"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.5"
getrandom = "0.4"
kern-protocol = { path = "crates/protocol" }
kern-engine = { path = "crates/engine" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"
