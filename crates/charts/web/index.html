<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KERN · Регистрация</title><link rel="stylesheet" href="/uplot.css"><link rel="stylesheet" href="/app.css"><script defer src="/uplot.js"></script><script defer src="/parameter-settings.js"></script><script defer src="/app.js"></script></head>
<body><header><svg class="logo" viewBox="0 0 64 64" aria-label="KERN"><path d="M12 21 32 10 52 21 32 32Z" fill="#1d2021"/><path d="m12 33 20 11 20-11M12 45l20 11 20-11" fill="none" stroke="#1d2021" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><strong>KERN</strong><span class="muted">Прототип · IM2480</span><span class="spacer"></span><span id="clock"></span><button id="paramsMode" title="Вид параметров">Параметры ▾</button></header>
<section id="values"></section><nav><button data-tab="charts" class="active">Графики</button><button data-tab="calibration">Настройка параметров</button><button data-tab="plugins">Плагины</button><span class="spacer"></span><button id="autoScale" class="active">Автошкалы</button><button id="earlier" title="Раньше">←</button><button id="live" class="active">Сейчас</button><button id="later" title="Позже">→</button><select id="interval" aria-label="Интервал"><option value="30">30 с</option><option value="60">1 мин</option><option value="300" selected>5 мин</option><option value="600">10 мин</option><option value="900">15 мин</option><option value="1800">30 мин</option><option value="3600">1 ч</option><option value="14400">4 ч</option><option value="43200">12 ч</option></select></nav>
<main><section id="charts" class="screen"><div id="timeaxis"></div><div id="tracks"></div><input id="history" type="range" min="0" max="86400" value="86400" aria-label="История за сутки"></section><section id="calibration" class="screen hidden">
<div class="toolbar"><strong>Настройка параметров</strong><span class="spacer"></span><span id="mapState"></span></div>
<div class="parameterWorkspace"><div class="tableScroll"><table id="parameterTable"><thead><tr><th>№</th><th>Название</th><th>Ед.</th><th>Источник / канал</th><th>Сигнал</th><th>Значение</th><th>Шкала</th></tr></thead><tbody id="mapRows"></tbody></table></div>
<aside class="parameterActions"><span class="muted">Управление</span><button id="newParam">Добавить…</button><button id="editParam" disabled>Редактировать…</button><button id="removeParam" disabled>Удалить</button><button id="undoParam" disabled>Отменить действие</button><span class="muted">Калибровка</span><button id="calibrateParam" disabled>Калибровка…</button></aside></div>
<div class="settingsFooter"><span class="muted" id="parameterHint">Выберите параметр. Начальные карты — тестовые.</span><span class="spacer"></span><button id="reloadMap">Отмена изменений</button><button id="saveMap" class="primary" disabled>Применить</button></div></section><section id="plugins" class="screen hidden"><div class="toolbar"><strong>Компоненты регистрации</strong><span class="spacer"></span><button id="refreshPlugins">Обновить</button></div><div id="pluginRows"></div></section></main>
<footer><span id="connection">Подключение…</span><span id="counts"></span><span id="message"></span><span class="spacer"></span><span id="recording">redb · CSV · резерв</span></footer>
<dialog id="editor"><form method="dialog"><h3 id="editTitle">Параметр</h3><div id="editFields"></div><p id="editError" class="error"></p><div class="actions"><button value="cancel">Отмена</button><button id="acceptEdit" value="default" class="primary">Применить</button></div></form></dialog>
<dialog id="calibrationDialog"><div class="calibrationHeading"><h3 id="calibrationTitle">Точки калибровки</h3><button id="closeCalibration" aria-label="Закрыть калибровку">×</button></div>
<div class="calibrationBody"><div class="calibrationPoints"><div class="signalView"><label>Сигнал <select id="signalView" aria-label="Единица сигнала"></select></label><small id="signalScale" class="muted"></small></div><div class="pointScroll"><table><thead><tr><th>№</th><th id="signalColumn">Сигнал, В</th><th id="parameterColumn">Значение</th></tr></thead><tbody id="pointRows"></tbody></table></div>
<div class="pointButtons"><button id="addPoint">Добавить</button><button id="removePoint">Удалить</button><button id="captureSignal">Снять сигнал</button><label class="multiply">× <input id="pointFactor" value="1" inputmode="decimal" aria-label="Коэффициент значений"><button id="multiplyPoints">Значения</button></label></div></div>
<div class="calibrationGraph"><div class="calibrationGraphTools"><div id="calibrationLive" class="muted"></div><span class="spacer"></span><button id="calibrationZoomIn" aria-label="Увеличить масштаб калибровки" title="Увеличить масштаб">+</button><button id="calibrationZoomOut" aria-label="Уменьшить масштаб калибровки" title="Уменьшить масштаб">−</button><button id="calibrationFit" title="Показать все точки">Вписать</button></div><canvas id="calibrationCanvas" aria-label="Зависимость сигнала от значения параметра"></canvas></div></div>
<label class="extrapolation"><input type="checkbox" id="calibrationExtrapolate"> Продолжать за крайними точками</label><p id="calibrationError" class="error" role="alert"></p>
<div class="settingsFooter"><button id="exportPoints">Сохранить в файл…</button><button id="importPoints">Загрузить из файла…</button><input type="file" id="pointsFile" accept=".json,application/json" hidden><span class="spacer"></span><button id="cancelCalibration">Отмена</button><button id="acceptCalibration" class="primary">Применить точки</button></div></dialog>
<dialog id="curvePicker"><h3>+ Кривая</h3><select id="curveChoice"></select><div class="actions"><button id="cancelCurve">Отмена</button><button id="addCurve" class="primary">Добавить</button></div></dialog>
</body></html>
