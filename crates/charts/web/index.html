<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KERN · Регистрация</title><link rel="stylesheet" href="/uplot.css"><link rel="stylesheet" href="/app.css"><script defer src="/uplot.js"></script><script defer src="/app.js"></script></head>
<body><header><svg class="logo" viewBox="0 0 64 64" aria-label="KERN"><path d="M12 21 32 10 52 21 32 32Z" fill="#1d2021"/><path d="m12 33 20 11 20-11M12 45l20 11 20-11" fill="none" stroke="#1d2021" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><strong>KERN</strong><span class="muted">Прототип · IM2480</span><span class="spacer"></span><span id="clock"></span><button id="paramsMode" title="Вид параметров">Параметры ▾</button></header>
<section id="values"></section><nav><button data-tab="charts" class="active">Графики</button><button data-tab="calibration">Калибровки</button><button data-tab="plugins">Плагины</button><span class="spacer"></span><button id="autoScale" class="active">Автошкалы</button><button id="earlier" title="Раньше">←</button><button id="live" class="active">Сейчас</button><button id="later" title="Позже">→</button><select id="interval" aria-label="Интервал"><option value="30">30 с</option><option value="60">1 мин</option><option value="300" selected>5 мин</option><option value="600">10 мин</option><option value="900">15 мин</option><option value="1800">30 мин</option><option value="3600">1 ч</option><option value="14400">4 ч</option><option value="43200">12 ч</option></select></nav>
<main><section id="charts" class="screen"><div id="timeaxis"></div><div id="tracks"></div><input id="history" type="range" min="0" max="86400" value="86400" aria-label="История за сутки"></section><section id="calibration" class="screen hidden"><div class="toolbar"><strong>Карты параметров</strong><span id="mapState"></span><span class="spacer"></span><button id="newParam">+ Параметр</button><button id="saveMap" class="primary">Сохранить карты</button><button id="reloadMap">Перечитать</button></div><p class="muted">Начальные карты — тестовые. Сохранённая версия применяется интерпретатором к новым входам; история сохраняет прежнюю карту.</p><div class="tableScroll"><table><thead><tr><th>Параметр</th><th>Источник</th><th>Канал</th><th>Ед.</th><th>Шкала</th><th>Точки raw → значение</th><th></th></tr></thead><tbody id="mapRows"></tbody></table></div></section><section id="plugins" class="screen hidden"><div class="toolbar"><strong>Компоненты регистрации</strong><span class="spacer"></span><button id="refreshPlugins">Обновить</button></div><div id="pluginRows"></div></section></main>
<footer><span id="connection">Подключение…</span><span id="counts"></span><span id="message"></span><span class="spacer"></span><span id="recording">redb · CSV · резерв</span></footer>
<dialog id="editor"><form method="dialog"><h3 id="editTitle">Параметр</h3><div id="editFields"></div><p id="editError" class="error"></p><div class="actions"><button value="cancel">Отмена</button><button id="acceptEdit" value="default" class="primary">Применить</button></div></form></dialog>
<dialog id="curvePicker"><h3>+ Кривая</h3><select id="curveChoice"></select><div class="actions"><button id="cancelCurve">Отмена</button><button id="addCurve" class="primary">Добавить</button></div></dialog>
</body></html>
